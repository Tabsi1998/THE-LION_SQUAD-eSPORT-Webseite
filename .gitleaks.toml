title = "THE LION SQUAD secret scan"

# Every rule Gitleaks ships stays on. What follows are the findings that were
# looked at one by one and are not credentials. Each entry binds the paths to
# the exact value they may contain, so the same file cannot quietly start
# carrying a real secret: any other value in it still fails the scan.

[extend]
useDefault = true

[[allowlists]]
description = "The settings encryption key of the CI's throwaway stack. It stands in ci.yml for anyone to read and protects no real data; the tests, the route inventory and the local check's container smoke use the same value."
condition = "AND"
paths = ['''^(\.github/workflows/ci\.yml|backend/tests/flow_harness\.py|backend/tests/test_runtime_security_unit\.py|scripts/route-inventory\.py|scripts/local_check\.py)$''']
regexTarget = "secret"
regexes = ['''^NQBHeGtQg5HYMo1HzvJtSQPN7X8YpJrZDvw-XMz0Bm8=$''']

[[allowlists]]
description = "The placeholder JWT secret the route inventory sets when none is configured, so it can import the app."
condition = "AND"
paths = ['''^scripts/route-inventory\.py$''']
regexTarget = "secret"
regexes = ['''^route-inventory-secret-with-at-least-32-chars$''']

[[allowlists]]
description = "The TOTP test secret from RFC 6238: base32 of 12345678901234567890."
condition = "AND"
paths = ['''^backend/tests/test_totp_secret_store_unit\.py$''']
regexTarget = "secret"
regexes = ['''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''']

[[allowlists]]
description = "A deliberately wrong password in the login test."
condition = "AND"
paths = ['''^backend/tests/test_live_preview_validation\.py$''']
regexTarget = "secret"
regexes = ['''^definitely-wrong-1$''']

[[allowlists]]
description = "The made-up new password the profile test types into the password panel (#258); the request body is asserted, nothing is real."
condition = "AND"
paths = ['''^frontend/src/pages/user/ProfilePage\.test\.jsx$''']
regexTarget = "secret"
regexes = ['''^neues-passwort-123$''']

[[allowlists]]
description = "The made-up password the login tests sign in with (#348); the accounts live only in the in-memory test database."
condition = "AND"
paths = ['''^backend/tests/test_login_comfort_flow\.py$''']
regexTarget = "secret"
regexes = ['''^Ein-langes-Testpasswort-42$''']

[[allowlists]]
description = "The made-up Discord server id of the partner tests (#469): eighteen digits in a row look like a Discord client id to the scanner; the value is only asserted, nothing is real."
condition = "AND"
paths = ['''^(backend/tests/test_partner_pages_flow\.py|frontend/src/pages/admin/AdminPartnersPage\.test\.jsx)$''']
regexTarget = "secret"
regexes = ['''^123456789012345678$''']

[[allowlists]]
description = "The made-up Discord user ids of the game-server tests (#838, merged with #839): eighteen digits after a Discord name look like a Discord client id to the scanner; the values are only asserted, nothing is real."
condition = "AND"
paths = ['''^backend/tests/test_discord_game_servers_flow\.py$''']
regexTarget = "secret"
regexes = ['''^[12]23456789012345678$''']

[[allowlists]]
description = "The made-up preview and egg tokens of the season tests (#632/#633 seasons, #810 carnival, #839 Easter egg hunt): the dotted shape looks like an API key to the scanner; the values are only mocked or asserted, nothing is real."
condition = "AND"
paths = ['''^(backend/tests/test_easter_hunt_flow\.py|frontend/src/pages/admin/AdminEasterHuntPage\.test\.jsx|frontend/src/seasons/carnival/index\.test\.jsx|frontend/src/pages/admin/settings/SeasonsSettings\.test\.jsx)$''']
regexTarget = "secret"
regexes = ['''^1\.2\.kaputt-und-zu-kurz$''', '''^easter_hunt\.1\.2\.sig$''', '''^carnival\.123\.0\.sig$''', '''^halloween\.123\.456\.abc$''']

[[allowlists]]
description = "Testwerte, kein Geheimnis: die erfundenen Passwörter des Passwort-Reset-Tests und der JWT-Schlüssel des Zwei-Faktor-Tests aus #1489. Seither haben die Tests Werte, die der Scanner nicht als Geheimnis liest; diese Ausnahme gilt nur für den einen Commit in der Historie, nur für die zwei Dateien und nur für genau diese drei Werte."
condition = "AND"
commits = ["7fa5c71908d1a743938ef212762de9cddcb9b19c"]
paths = ['''^backend/tests/(test_password_reset_tokens_flow|test_mfa_one_time_codes_flow)\.py$''']
regexTarget = "secret"
regexes = ['''^Neues-Passwort-2026$''', '''^Anderes-Passwort-2026$''', '''^mfa-tests-secret-with-at-least-32-characters$''']

[[allowlists]]
description = "Testwert, kein Geheimnis: das erfundene Passwort des Tests zum Abbrechen der Zwei-Faktor-Abfrage (#996); das Konto lebt nur in der Datenbank im Speicher."
condition = "AND"
paths = ['''^backend/tests/test_mfa_cancel_flow\.py$''']
regexTarget = "secret"
regexes = ['''^Ein-langes-Testpasswort-42$''']

[[allowlists]]
description = "Testwerte, kein Geheimnis: das erfundene Passwort und der JWT-Schlüssel des Anmelde-Vertragstests (#1510); die Konten leben nur in der Datenbank im Speicher, der Schlüssel signiert nichts Echtes."
condition = "AND"
paths = ['''^backend/tests/test_account_sign_in_contract_flow\.py$''']
regexTarget = "secret"
regexes = ['''^Loewen-Testpasswort-1$''', '''^sign-in-tests-secret-with-at-least-32-characters$''']

[[allowlists]]
description = "Testwerte, kein Geheimnis: die Umbau-Marker (`rebuild_token`) in den erzeugten FFA-Testdaten aus #1561. Sie stammen aus der Datenbank im Speicher von scripts/make_ffa_bracket_fixture.py und dienen dem Server nur als Vergleichswert beim Zurückschreiben eines Lauf-Umbaus - kein Zugang, kein Schlüssel. Nur genau diese fünf Werte in genau dieser Datei."
condition = "AND"
paths = ['''^frontend/e2e/fixtures/ffaGenerated\.json$''']
regexTarget = "secret"
regexes = ['''^(2bab3a2f-53a4-4021-af11-458ee0955578|84a0f042-d626-4e54-910a-22ba39c95b10|97e39310-bdeb-4fca-966a-703c4359de41|9c4ecb0d-a8d7-44d6-8773-8013f0cf46d5|da458179-22b1-4b09-97d5-9301099181f4)$''']
