name: Liga-Gesamtabnahme

# Liga-Gesamtabnahme G.1 (#1632, docs/liga/abnahme.md, Entscheidung Nr. 178): die 18 Szenarien und die Grenzfälle im Browser
# (390 und 1440 px) gegen das echte Backend (uvicorn) und ein echtes MongoDB als Dienst - kein Docker-Stand, kein Zeitplan im
# Backend (die Zeit-Jobs stößt die Spec gezielt an). Nur Testdaten aus scripts/seed_liga_g1.py, Versandsperre an, nie Produktion.
# Sparsam: nur nachts und von Hand, Laufzeit-Grenze, Artefakte nur bei Rot (7 Tage, ohne Traces und Zugänge).
# Rot: Issue „Liga-Gesamtabnahme rot“ anlegen oder kommentieren; die erste grüne Nacht danach kommentiert und schließt es.
on:
  schedule:
    # 01:30 UTC = 02:30 Wiener Winterzeit, 03:30 Sommerzeit.
    - cron: "30 1 * * *"
  # VORLAEUFIG zum Pruefen ohne Merge - vor der Uebergabe wieder entfernen.
  push:
    branches: [test/liga-g1-abnahme]
  workflow_dispatch:
    inputs:
      melden:
        description: "Ergebnis als Issue melden (rot: anlegen/kommentieren, grün nach rot: schließen)"
        type: boolean
        default: false
      specs:
        description: "Nur diese Specs aus frontend/e2e/liga-abnahme/, durch Leerzeichen getrennt (leer = alle)"
        type: string
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: liga-abnahme-nacht
  cancel-in-progress: false

jobs:
  abnahme:
    name: Liga-Gesamtabnahme gegen echtes Backend und MongoDB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mongodb:
        # Dasselbe Bild wie docker-compose.yml.
        image: mongo:7.0.40-jammy
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      G1_MONGO_URL: mongodb://127.0.0.1:27017
      G1_DIR: ${{ github.workspace }}/liga-abnahme
      G1_SPECS: ${{ inputs.specs }}
      # Öffentliches Repo: keine Playwright-Traces (sie zeichnen Anmeldung und Sitzungen der Testkonten auf).
      G1_TRACE: "off"
      ABNAHME_SHOTS: ${{ github.workspace }}/liga-abnahme/bilder
      PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Website-Pakete installieren
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Browser installieren
        working-directory: frontend
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=15 300 npx playwright install --with-deps chromium; then exit 0; fi
            sudo pkill -9 -f '/usr/lib/apt/methods|apt-get' || true
            sleep 10
          done
          exit 1
      - name: Backend starten
        run: bash scripts/run_liga_g1.sh up
      - name: Testwelt anlegen
        run: bash scripts/run_liga_g1.sh seed
      - name: Abnahme im Browser
        timeout-minutes: 30
        run: bash scripts/run_liga_g1.sh run
      - name: Backend-Protokoll bei Rot
        if: failure()
        run: tail -n 200 "$G1_DIR/backend.log" || true
      - name: Ergebnisse als Artefakt (nur bei Rot)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: liga-abnahme
          path: |
            liga-abnahme/
            !liga-abnahme/**/trace.zip
            !liga-abnahme/**/*.trace
            !liga-abnahme/state*.json
            !liga-abnahme/sessions-*/**
            !liga-abnahme/uploads/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Backend stoppen
        if: always()
        run: bash scripts/run_liga_g1.sh down

  # Getrennter Job: nur die Meldung darf Issues schreiben, nicht der Job, der Code und Browser ausführt. Kein Inhalt aus dem
  # Lauf im Issue - nur Ergebnis, Commit und Link zum Lauf (keine Personendaten, keine Geheimnisse).
  meldung:
    name: Meldung als Issue
    needs: abnahme
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.melden) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Issue anlegen, kommentieren oder schließen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.abnahme.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="Liga-Gesamtabnahme rot"
          number=$(gh issue list --state open --label testing --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          stamp=$(TZ=Europe/Vienna date '+%d.%m.%Y %H:%M')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "Wieder grün am $stamp (Commit ${SHA:0:9}): $RUN_URL"
              gh issue close "$number"
            fi
            exit 0
          fi
          body="Die Liga-Gesamtabnahme (docs/liga/abnahme.md) ist am $stamp rot (Ergebnis: $RESULT, Commit ${SHA:0:9}). Lauf und Bericht: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label testing --label bug --body "$body"
          fi
