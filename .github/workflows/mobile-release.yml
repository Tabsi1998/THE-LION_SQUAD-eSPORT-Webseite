name: Mobile APK Release

# Notweg. App-Releases entstehen lokal mit `npm run release:local` (siehe
# mobile/RELEASES.md), weil Actions-Minuten Geld kosten. Dieser Workflow startet
# nur von Hand und baut eine signierte APK als Artefakt; er veröffentlicht kein
# Release. Früher lief er bei jedem Tag `mobile-v*` - das würde jetzt bei jedem
# lokalen Release zusätzlich GitHub Actions starten.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Mobile release preflight
        working-directory: mobile
        run: npm run release:preflight

      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck

      - name: Validate Expo SDK compatibility
        working-directory: mobile
        run: |
          npm run audit:ci
          npx expo install --check
          npx expo-doctor

      - name: Resolve release metadata
        id: meta
        working-directory: mobile
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          APK_NAME="$(node -p "require('./scripts/release-version.cjs').apkName('${VERSION}', ${VERSION_CODE}, '${GITHUB_SHA::7}')")"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: "1"
          REQUIRE_ANDROID_PUSH_CONFIG: "1"
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          node scripts/prepare-google-services.cjs
          npx expo prebuild --platform android --clean

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android release signing
        working-directory: mobile
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "$ANDROID_KEY_ALIAS" ] || missing+=("ANDROID_KEY_ALIAS")
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Android release signing secrets: ${missing[*]}"
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          {
            echo ""
            echo "TLS_UPLOAD_STORE_FILE=release.keystore"
            echo "TLS_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "TLS_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "TLS_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> android/gradle.properties
          node scripts/configure-android-signing.cjs

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Stage, verify and checksum APK
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p builds
          APK="builds/${{ steps.meta.outputs.apk_name }}"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | grep Signer > "$APK.signature.txt"
          DIGEST="$(node -p "require('./scripts/release-version.cjs').signerDigest(require('fs').readFileSync('$APK.signature.txt', 'utf8'))")"
          EXPECTED="$(node -p "require('./scripts/release-version.cjs').EXPECTED_SIGNER_SHA256")"
          if [ "$DIGEST" != "$EXPECTED" ]; then
            echo "::error::APK is not signed with the LionsAPP upload key ($DIGEST)."
            exit 1
          fi
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: |
            mobile/builds/${{ steps.meta.outputs.apk_name }}
            mobile/builds/${{ steps.meta.outputs.apk_name }}.sha256
            mobile/builds/${{ steps.meta.outputs.apk_name }}.signature.txt
          if-no-files-found: error
          retention-days: 7
