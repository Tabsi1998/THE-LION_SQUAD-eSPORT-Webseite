name: CodeQL

# Code Scanning verfolgt Daten durch den Code (Eingabe -> Datenbank, Dateipfad,
# Antwort) und findet Lücken, die Lint, Paket-Audits und der Geheimnis-Scan
# nicht sehen. Das Repo ist seit Oktober 2026 öffentlich, damit kostet es
# nichts mehr (#954); davor lief es nur von Hand.
# Auslöser: jeder Pull Request (Pflicht-Ergebnis für die Regel auf main), Merges
# nach main, die Code berühren, dazu einmal die Woche (frische Regeln von
# GitHub) und von Hand. Entwürfe starten nichts.
on:
  # Bei Pull Requests ohne Pfad-Filter: Die Regel für main verlangt ein CodeQL-Ergebnis
  # für jeden PR. Mit Filter wartete ein reiner Doku- oder Workflow-PR ewig darauf.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "mobile/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Ein neuer Push löst den laufenden Lauf desselben Zweigs ab.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
