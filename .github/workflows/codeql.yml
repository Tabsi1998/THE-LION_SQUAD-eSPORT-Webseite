name: CodeQL

# Nur manuell. Das Repo ist privat; Code Scanning braucht dort GitHub Code
# Security. Ohne das läuft die Analyse jeweils rund acht Minuten und scheitert
# erst beim Hochladen, ohne verwertbares Ergebnis.
# Wieder automatisch (pull_request, wöchentlich), sobald das Repo öffentlich ist
# oder Code Security aktiviert wurde.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
