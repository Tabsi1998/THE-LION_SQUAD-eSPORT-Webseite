name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: tls_ci
      DISABLE_SCHEDULER: "true"
      UPLOAD_DIR: /tmp/tls-uploads
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Run backend unit tests
        run: |
          mkdir -p test-results
          python -m pytest -m "not live" \
            --cov=backend \
            --cov-report=xml:test-results/backend-coverage.xml \
            --junitxml=test-results/backend-junit.xml
      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate reverse-proxy deployment config
        env:
          CORS_ORIGINS: https://example.test
          FRONTEND_URL: https://example.test
          JWT_SECRET: ci-only-secret-value-with-at-least-32-characters
          PUBLIC_BACKEND_URL: https://example.test
        run: |
          docker compose config -q
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --volume "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Audit frontend dependencies
        working-directory: frontend
        run: yarn audit:high
      - name: Build frontend
        working-directory: frontend
        run: yarn build
      - name: Run frontend unit smoke
        working-directory: frontend
        run: yarn test --watchAll=false --passWithNoTests --coverage --coverageReporters=text-summary --coverageReporters=lcov
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests desktop and mobile
        working-directory: frontend
        run: yarn test:e2e
      - name: Upload frontend test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: |
            frontend/coverage/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  mobile:
    name: Mobile App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Audit mobile dependencies
        working-directory: mobile
        run: npm audit --audit-level=moderate
      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Run mobile security regressions
        working-directory: mobile
        run: npm run test:security
      - name: Mobile release preflight
        working-directory: mobile
        run: npm run release:preflight
      - name: Validate Expo config
        working-directory: mobile
        run: |
          npx expo install --check
          npx expo-doctor
