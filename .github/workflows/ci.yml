name: CI

# Lokal zuerst, GitHub bestätigt: Die Prüfungen laufen vor dem Push auf dem
# Entwicklungsrechner (lokaler CI-Spiegel liest genau diese Datei).
# - Entwurfs-PRs lösen nichts aus; "Ready for review" startet den Lauf.
# - Nur die Jobs laufen, deren Bereich die Änderung berührt (scripts/ci-changed-areas.py).
# - Der Geheimnis-Scan läuft bei jeder Änderung.
# - Nach dem Merge läuft die CI ein zweites Mal auf main (#1734): Das Repo ist
#   öffentlich, Actions-Minuten auf den Standard-Runnern kosten nichts, und das
#   CI-Badge in der README zeigt so den echten Stand von main.
# - Runner fest auf ubuntu-24.04 (#1739): ubuntu-latest wechselt am 19.10.2026 auf
#   Ubuntu 26. Umstieg bewusst in einem eigenen PR, wenn Browser- und Docker-Schritte
#   dort geprüft sind.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Bei PRs löst ein neuer Push den laufenden Lauf ab. Auf main läuft jeder Merge zu
# Ende, sonst stünde im Badge „abgebrochen“ statt eines Ergebnisses.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Bereiche und Geheimnis-Scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      mobile: ${{ steps.areas.outputs.mobile }}
      container: ${{ steps.areas.outputs.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan tracked source for secrets and removed provider remnants
        run: python3 scripts/check-secrets.py
      - name: Decide which jobs this change needs
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          # Manueller Lauf oder Push ohne Vorgänger (neuer Zweig): alles prüfen.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            python3 scripts/ci-changed-areas.py --all >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci-changed-areas.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    # Die Suite braucht 10-15 Minuten (5500+ Tests), je nach Runner; 15 riss am 19.10. knapp.
    timeout-minutes: 40
    env:
      APP_ENV: test
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: tls_ci
      DISABLE_SCHEDULER: "true"
      UPLOAD_DIR: /tmp/tls-uploads
      # Ergebnis-Bilder (#1756): ohne Tesseract schlagen die Lese-Tests fehl, statt still zu überspringen.
      REQUIRE_TESSERACT: "1"
      # Zweiter Leser (#2018): das Modell wie im Image (backend/Dockerfile), die Tests mit ihm laufen immer.
      RESULT_IMAGE_SECOND_READER_MODEL: /tmp/ocr-models/PP-OCRv6_rec_small.onnx
      REQUIRE_SECOND_READER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Tesseract (text recognition, as in backend/Dockerfile)
        # Kurze Zeitlimits für apt wie bei der Browser-Installation - ein hängender Paketspiegel bricht hier ab.
        timeout-minutes: 8
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Languages "none";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-tls-timeouts > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu
          tesseract --list-langs
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Load the second reader model (as in backend/Dockerfile)
        # Gleiche Vorgabe-Adresse wie das Dockerfile, gleiche feste SHA-256 (backend/ocr-model.sha256).
        timeout-minutes: 5
        run: |
          url=$(sed -n 's/.*OCR_MODEL_URL:-\([^}]*\)}.*/\1/p' backend/Dockerfile)
          sha=$(cut -d' ' -f1 backend/ocr-model.sha256)
          test -n "$url" && test -n "$sha"
          mkdir -p /tmp/ocr-models
          curl --fail --silent --show-error --location --retry 3 --output "$RESULT_IMAGE_SECOND_READER_MODEL" "$url"
          echo "$sha  $RESULT_IMAGE_SECOND_READER_MODEL" | sha256sum --check
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Check documentation links
        run: python scripts/check-doc-links.py
      - name: Validate shell scripts
        # Jede *.sh, die Git kennt, einzeln (#980): `bash -n a.sh b.sh` prüfte nur a.sh. Fehler nennen die Datei.
        run: bash scripts/check-shell-syntax.sh
      - name: Lint backend for undefined names, syntax hazards and unused imports/variables
        run: flake8 backend --select=E9,F63,F7,F82,F401,F841 --exclude=backend/tests
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Run backend unit tests
        run: |
          mkdir -p test-results
          python -m pytest -m "not live" \
            --cov=backend \
            --cov-fail-under=35 \
            --cov-report=xml:test-results/backend-coverage.xml \
            --junitxml=test-results/backend-junit.xml
      - name: Upload backend test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    # Prüfen, Bauen und Unit-Tests; die Browser-Tests laufen parallel im Job darunter.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate reverse-proxy deployment config
        env:
          CORS_ORIGINS: https://example.test
          FRONTEND_URL: https://example.test
          JWT_SECRET: ci-only-secret-value-with-at-least-32-characters
          SETTINGS_ENCRYPTION_KEY: NQBHeGtQg5HYMo1HzvJtSQPN7X8YpJrZDvw-XMz0Bm8=
          MONGO_USERNAME: tls_ci_admin
          MONGO_PASSWORD: tls-ci-mongo-password
          PUBLIC_BACKEND_URL: https://example.test
        run: |
          docker compose config -q
          docker compose config --format json | python3 scripts/compose-backup-target.py --db tls_arena
          docker compose --env-file .env.staging.example -p tls-staging -f docker-compose.yml -f docker-compose.staging.yml config --format json | python3 scripts/compose-backup-target.py --db tls_arena_staging --volume tls-staging_uploads_data
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --volume "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
      - name: Validate public and legacy route contract
        run: bash scripts/check-public-routes.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Audit frontend dependencies
        working-directory: frontend
        run: yarn audit:high
      - name: Lint frontend
        # Known accessibility findings are recorded in eslint-suppressions.json,
        # so this gate blocks new ones while the existing list is worked off.
        working-directory: frontend
        run: yarn lint
      - name: Build frontend
        working-directory: frontend
        run: yarn build
      - name: Run frontend unit smoke
        working-directory: frontend
        run: yarn test:coverage
      - name: Upload frontend test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: |
            frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  frontend-e2e:
    # Die Browser-Tests (Desktop und Handy) brauchten in einem Job gut 30 Minuten. Vier Teile auf vier Rechnern
    # gleichzeitig: dieselben Tests, ein Viertel der Wartezeit. Für ein öffentliches Repo kostet das nichts.
    name: Browser-Tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    # Platz für einen wiederholten Browser-Download plus die Tests (gut 11 Minuten je Teil).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        # Antwortet ein Ubuntu-Paketspiegel nicht, wartete apt-get ohne Ende (am 7.10. zweimal 25 Minuten, dann brach
        # der ganze Teil ab). Jetzt: kurze Zeitlimits für apt, je Versuch höchstens 5 Minuten, bis zu drei Versuche.
        timeout-minutes: 18
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Languages "none";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-tls-timeouts > /dev/null
          for attempt in 1 2 3; do
            if timeout --kill-after=15 300 npx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Browser-Installation hing oder brach ab (Versuch $attempt von 3)"
            # Ein abgebrochenes apt-get hält sonst seine Sperre und der nächste Versuch scheitert sofort.
            sudo pkill -9 -f '/usr/lib/apt/methods|apt-get' || true
            sleep 10
          done
          exit 1
      - name: Run browser smoke tests desktop and mobile (part ${{ matrix.shard }} of 4)
        working-directory: frontend
        run: yarn test:e2e --shard=${{ matrix.shard }}/4
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-results-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    name: Mobile App
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Validate Android release Java setup without publishing
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify Java runtime
        run: java -version
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Audit mobile dependencies
        working-directory: mobile
        run: npm run audit:ci
      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Run mobile security regressions
        working-directory: mobile
        run: npm run test:security
      - name: Run mobile release tooling tests
        working-directory: mobile
        run: npm run test:release
      - name: Run mobile unit tests
        working-directory: mobile
        run: npm test
      - name: Mobile release preflight
        working-directory: mobile
        run: npm run release:preflight
      - name: Validate Expo config
        working-directory: mobile
        run: |
          npx expo install --check
          # Keep CI reproducible until the Expo SDK 57 migration in #117 is complete.
          npx --yes expo-doctor@1.20.4

  container-smoke:
    name: Production container smoke
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: production
      CORS_ORIGINS: https://example.test
      FRONTEND_URL: https://example.test
      PUBLIC_BACKEND_URL: https://example.test
      JWT_SECRET: ci-only-secret-value-with-at-least-32-characters
      SETTINGS_ENCRYPTION_KEY: NQBHeGtQg5HYMo1HzvJtSQPN7X8YpJrZDvw-XMz0Bm8=
      MONGO_USERNAME: tls_ci_admin
      MONGO_PASSWORD: tls-ci-mongo-password
      FRONTEND_BIND: 127.0.0.1
      BACKEND_BIND: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - name: Build hardened images
        run: docker compose build
      - name: Start production stack
        run: docker compose up -d
      - name: Verify liveness and readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/api/health/live >/dev/null && \
               curl --fail --silent http://127.0.0.1:8001/api/health/ready >/dev/null && \
               curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1
      - name: Verify text recognition in the backend image
        # Ergebnis-Bilder (#1756): Tesseract mit Deutsch muss im Image sein - und der zweite Leser (#2018) mit Modell.
        run: |
          docker compose exec -T backend tesseract --list-langs | grep -qx deu
          docker compose exec -T backend python -c "from services import result_image_second as s; st = s.status(); print(st); assert st['status'] == 'ok'"
      - name: Read-only host inventory smoke
        run: python3 scripts/staging-preflight.py
      - name: Verify web release and cache headers
        run: python3 scripts/check-web-update.py http://127.0.0.1:3000
      - name: Verify uploads are served by nginx
        run: python3 scripts/check-media-serving.py http://127.0.0.1:3000
      - name: Stop ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  # Ein Name für die Pflicht-Prüfung in der GitHub-Regel für main: grün, wenn keine
  # der Prüfungen oben fehlgeschlagen oder abgebrochen ist (übersprungene zählen als ok).
  # So deckt die Regel auch die Browser-Tests ab, deren Matrix-Namen bei übersprungenen
  # Läufen nicht aufgelöst werden.
  ci-result:
    name: CI-Ergebnis
    needs: [changes, backend, frontend, frontend-e2e, mobile, container-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ergebnis der Prüfungen
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Ergebnisse: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "Mindestens eine Prüfung ist nicht grün ($result)."; exit 1 ;;
            esac
          done
