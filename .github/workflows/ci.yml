name: CI

# Lokal zuerst, GitHub bestätigt: Die Prüfungen laufen vor dem Push auf dem
# Entwicklungsrechner (lokaler CI-Spiegel liest genau diese Datei).
# - Entwurfs-PRs lösen nichts aus; "Ready for review" startet den Lauf.
# - Nur die Jobs laufen, deren Bereich die Änderung berührt (scripts/ci-changed-areas.py).
# - Der Geheimnis-Scan läuft bei jeder Änderung.
# - Nach dem Merge läuft die CI ein zweites Mal auf main (#1734): Das Repo ist
#   öffentlich, Actions-Minuten auf den Standard-Runnern kosten nichts, und das
#   CI-Badge in der README zeigt so den echten Stand von main.
# - Runner fest auf ubuntu-24.04 (#1739): ubuntu-latest wechselt am 19.10.2026 auf
#   Ubuntu 26. Umstieg bewusst in einem eigenen PR, wenn Browser- und Docker-Schritte
#   dort geprüft sind.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Bei PRs löst ein neuer Push den laufenden Lauf ab. Auf main läuft jeder Merge zu
# Ende, sonst stünde im Badge „abgebrochen“ statt eines Ergebnisses.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Bereiche und Geheimnis-Scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      mobile: ${{ steps.areas.outputs.mobile }}
      container: ${{ steps.areas.outputs.container }}
      prueftor: ${{ steps.areas.outputs.prueftor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan tracked source for secrets and removed provider remnants
        run: python3 scripts/check-secrets.py
      - name: Decide which jobs this change needs
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          # Manueller Lauf oder Push ohne Vorgänger (neuer Zweig): alles prüfen.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            python3 scripts/ci-changed-areas.py --all >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci-changed-areas.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  # Backend in drei Jobs (#2054): Die Suite (7000+ Tests) brauchte in einem Job 24 Minuten. Jetzt prüft ein Job
  # Code und Abhängigkeiten, die Suite läuft in drei Teilen gleichzeitig (je vier Prozesse mit pytest-xdist), und
  # ein kleiner Folgejob legt die Coverage der Teile zusammen und prüft die Schwelle über das ganze Backend.
  backend-checks:
    name: Backend-Prüfungen
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Check documentation links
        run: python scripts/check-doc-links.py
      - name: Validate shell scripts
        # Jede *.sh, die Git kennt, einzeln (#980): `bash -n a.sh b.sh` prüfte nur a.sh. Fehler nennen die Datei.
        run: bash scripts/check-shell-syntax.sh
      - name: ShellCheck install.sh and update.sh
        # Restpunkt aus #934 (#1908): die beiden Skripte, die Betreiber ausführen, bleiben ohne ShellCheck-Fund.
        # shellcheck liegt auf dem Runner bereit; die übrigen Skripte zählt scripts/local_check.py (Baseline).
        run: shellcheck install.sh update.sh
      - name: Lint backend for undefined names, syntax hazards and unused imports/variables
        run: flake8 backend --select=E9,F63,F7,F82,F401,F841 --exclude=backend/tests
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt

  backend:
    # Jede Testdatei läuft in genau einem Teil; verteilt wird nach gemessener Dauer (backend/tests/shard_plan.py).
    name: Backend-Tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    # Ein Teil braucht gut 4 Minuten samt Einrichtung; 15 lässt Platz für einen langsamen Runner.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      APP_ENV: test
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: tls_ci
      DISABLE_SCHEDULER: "true"
      UPLOAD_DIR: /tmp/tls-uploads
      # Ergebnis-Bilder (#1756): ohne Tesseract schlagen die Lese-Tests fehl, statt still zu überspringen.
      REQUIRE_TESSERACT: "1"
      # Zweiter Leser (#2018): das Modell wie im Image (backend/Dockerfile), die Tests mit ihm laufen immer.
      RESULT_IMAGE_SECOND_READER_MODEL: /tmp/ocr-models/PP-OCRv6_rec_small.onnx
      REQUIRE_SECOND_READER: "1"
      TEST_SHARD: ${{ matrix.shard }}/3
      TEST_SHARD_REPORT: test-results/backend-shard-${{ matrix.shard }}.json
      # Ohne Punkt am Anfang: upload-artifact lässt versteckte Dateien weg.
      COVERAGE_FILE: test-results/backend-coverage-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Tesseract (text recognition, as in backend/Dockerfile)
        # Kurze Zeitlimits für apt wie bei der Browser-Installation - ein hängender Paketspiegel bricht hier ab.
        timeout-minutes: 8
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Languages "none";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-tls-timeouts > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu
          tesseract --list-langs
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Load the second reader model (as in backend/Dockerfile)
        # Gleiche Vorgabe-Adresse wie das Dockerfile, gleiche feste SHA-256 (backend/ocr-model.sha256).
        timeout-minutes: 10
        run: |
          url=$(sed -n 's/.*OCR_MODEL_URL:-\([^}]*\)}.*/\1/p' backend/Dockerfile)
          sha=$(cut -d' ' -f1 backend/ocr-model.sha256)
          test -n "$url" && test -n "$sha"
          mkdir -p /tmp/ocr-models
          curl --fail --silent --show-error --location --retry 5 --retry-delay 20 --retry-all-errors \
            --output "$RESULT_IMAGE_SECOND_READER_MODEL" "$url"
          echo "$sha  $RESULT_IMAGE_SECOND_READER_MODEL" | sha256sum --check
      - name: Run backend unit tests (part ${{ matrix.shard }} of 3)
        # Die Schwelle (--cov-fail-under=35) prüft der Job "Backend-Coverage" über alle Teile zusammen.
        run: |
          mkdir -p test-results
          python -m pytest -m "not live" \
            --numprocesses=auto \
            --cov=backend \
            --cov-report= \
            --junitxml=test-results/backend-junit-${{ matrix.shard }}.xml
      - name: Upload backend test results and coverage data
        # Immer: Der Coverage-Job braucht die Daten, bei Fehlern dienen JUnit-Bericht und Teilbericht der Diagnose.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  backend-coverage:
    name: Backend-Coverage
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install coverage (same version as the test parts)
        run: pip install "$(grep -E '^coverage==' backend/requirements-dev.txt)"
      - uses: actions/download-artifact@v8
        with:
          pattern: backend-test-results-*
          path: test-results
          merge-multiple: true
      - name: Every test file ran in exactly one part
        run: python scripts/test-shards.py check test-results/backend-shard-*.json
      - name: Combine coverage and enforce the floor over the whole backend
        # Dieselbe Schwelle wie vorher mit --cov-fail-under=35 in einem Job: gemessen über alle Teile zusammen.
        run: |
          coverage combine --keep test-results/backend-coverage-*
          coverage xml -o test-results/backend-coverage.xml
          echo "Coverage des ganzen Backends: $(coverage report --format=total --precision=2)%"
          coverage report --fail-under=35 --format=total
      - name: Upload combined backend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: test-results/backend-coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # Dieselben Abläufe wie in „Backend-Tests“, aber auf echtem MongoDB (#2200): Indizes, Sperren und Aggregationen, die
  # mongomock nicht prüft. Jeder Prozess hat seine Datenbank, jeder Test beginnt leer: backend/tests/flow_mongo.py.
  backend-mongo:
    name: Backend-Abläufe auf MongoDB
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      # Wie in „Backend-Tests“: auf 27017 antwortet niemand. Die Abläufe schreiben nur in ihre eigene Testdatenbank.
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: tls_ci
      DISABLE_SCHEDULER: "true"
      UPLOAD_DIR: /tmp/tls-uploads
      FLOW_MONGO_URL: mongodb://127.0.0.1:27217
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Start MongoDB (same image as docker-compose.yml)
        # Kein services-Block: der kann dem Server keine Argumente mitgeben, der Speicher soll aber klein bleiben.
        run: |
          image=$(sed -n 's/^ *image: \(mongo:.*\)$/\1/p' docker-compose.yml)
          test -n "$image"
          docker run --detach --name flow-mongo --publish 127.0.0.1:27217:27017 --tmpfs /data/db:size=4g \
            "$image" --wiredTigerCacheSizeGB 1
          for attempt in $(seq 1 30); do
            if docker exec flow-mongo mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'; then exit 0; fi
            sleep 2
          done
          docker logs flow-mongo
          exit 1
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Run the league, squad, match and map flows on MongoDB
        run: python scripts/flow_mongo_tests.py --numprocesses=auto

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    # Prüfen und Bauen; Unit- und Browser-Tests laufen parallel in den Jobs darunter.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate reverse-proxy deployment config
        env:
          CORS_ORIGINS: https://example.test
          FRONTEND_URL: https://example.test
          JWT_SECRET: ci-only-secret-value-with-at-least-32-characters
          SETTINGS_ENCRYPTION_KEY: NQBHeGtQg5HYMo1HzvJtSQPN7X8YpJrZDvw-XMz0Bm8=
          MONGO_USERNAME: tls_ci_admin
          MONGO_PASSWORD: tls-ci-mongo-password
          PUBLIC_BACKEND_URL: https://example.test
        run: |
          docker compose config -q
          docker compose config --format json | python3 scripts/compose-backup-target.py --db tls_arena
          docker compose --env-file .env.staging.example -p tls-staging -f docker-compose.yml -f docker-compose.staging.yml config --format json | python3 scripts/compose-backup-target.py --db tls_arena_staging --volume tls-staging_uploads_data
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --volume "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
      - name: Validate public and legacy route contract
        run: bash scripts/check-public-routes.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Audit frontend dependencies
        working-directory: frontend
        run: yarn audit:high
      - name: Self-test the browser test split
        working-directory: frontend
        run: node --test scripts/e2e-shards.test.mjs
      - name: Lint frontend
        # Known accessibility findings are recorded in eslint-suppressions.json,
        # so this gate blocks new ones while the existing list is worked off.
        working-directory: frontend
        run: yarn lint
      - name: Build frontend
        working-directory: frontend
        run: yarn build
      - name: Check startup bundle budget
        # Budget-Gate (#936): zählt die JS-Dateien des anonymen Starts aus dem Vite-Manifest (gzip Stufe 9) und
        # vergleicht mit frontend/PERFORMANCE_BUDGETS.md. Editor, Diagramme, PDF und QR dürfen nicht vorab laden.
        working-directory: frontend
        run: yarn check:bundle

  frontend-unit:
    # Die Unit-Tests (Vitest, 650+ Dateien) brauchten im Frontend-Job knapp acht Minuten. Zwei Teile gleichzeitig
    # (#2054); jeder schreibt einen Blob-Bericht samt Coverage, "Frontend-Coverage" legt sie zum Gesamtbericht zusammen.
    name: Frontend-Unit-Tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run frontend unit smoke (part ${{ matrix.shard }} of 2)
        working-directory: frontend
        run: >-
          yarn test:coverage --shard=${{ matrix.shard }}/2
          --reporter=default --reporter=github-actions --reporter=blob
          --outputFile.blob=vitest-blob/blob-${{ matrix.shard }}.json
      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-blob-${{ matrix.shard }}
          path: frontend/vitest-blob/
          if-no-files-found: error
          retention-days: 7
      - name: Upload frontend test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results-${{ matrix.shard }}
          path: |
            frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  frontend-coverage:
    name: Frontend-Coverage
    needs: frontend-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: frontend-unit-blob-*
          path: frontend/vitest-blob
          merge-multiple: true
      - name: Merge unit test reports and coverage of both parts
        # Derselbe Gesamtbericht wie vorher aus einem Lauf: alle Testdateien, Coverage über das ganze Frontend.
        working-directory: frontend
        run: yarn test --merge-reports=vitest-blob --coverage --reporter=default

  frontend-e2e:
    # Die Browser-Tests (Desktop und Handy) brauchten in einem Job gut 30 Minuten. Sechs Teile auf sechs Rechnern
    # gleichzeitig: dieselben Tests, ein Sechstel der Wartezeit. Für ein öffentliches Repo kostet das nichts.
    # Verteilt wird nach gemessener Dauer statt nach Zahl der Tests (#2054): --shard zählte Tests, die sich erst
    # zur Laufzeit überspringen, voll mit - Teil 1 brauchte 15 Minuten, Teil 4 sechs.
    name: Browser-Tests (${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    # Platz für einen wiederholten Browser-Download (bis 18 Minuten) plus die Tests (gut 7 Minuten je Teil).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # Barrierefreiheit, Layout-Sprung und Bewegung laufen im Job „Prüftor“ gegen das gebaute dist (#1660), hier
      # nicht noch einmal (e2e/prueftor-specs.js). Gilt für Plan und Lauf, so bleibt die Verteilung stimmig.
      E2E_OHNE_PRUEFTOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Restore browser and its system packages from the cache
        # Ein langsamer Paketspiegel kostete am 27.10. einen Teil neun Minuten (51 kB/s, #2054). Browser und die
        # .deb-Pakete von --with-deps kommen deshalb aus dem Cache; apt lädt dann nur, was fehlt oder neuer ist.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-debs
          key: playwright-ubuntu-24.04-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: playwright-ubuntu-24.04-
      - name: Install Playwright browser
        working-directory: frontend
        # Antwortet ein Ubuntu-Paketspiegel nicht, wartete apt-get ohne Ende (am 7.10. zweimal 25 Minuten, dann brach
        # der ganze Teil ab). Jetzt: kurze Zeitlimits für apt, je Versuch höchstens 5 Minuten, bis zu drei Versuche.
        timeout-minutes: 18
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Languages "none";\nAPT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-tls-timeouts > /dev/null
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/
          fi
          for attempt in 1 2 3; do
            if timeout --kill-after=15 300 npx playwright install --with-deps chromium; then
              # Für den Cache (gespeichert nur, wenn es den Schlüssel noch nicht gab).
              mkdir -p "$HOME/apt-debs"
              cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/" 2>/dev/null || true
              exit 0
            fi
            echo "::warning::Browser-Installation hing oder brach ab (Versuch $attempt von 3)"
            # Ein abgebrochenes apt-get hält sonst seine Sperre und der nächste Versuch scheitert sofort.
            sudo pkill -9 -f '/usr/lib/apt/methods|apt-get' || true
            sleep 10
          done
          exit 1
      - name: Plan part ${{ matrix.shard }} of 6 by measured duration
        # Schreibt die Testliste dieses Teils und prüft mit Playwright, dass sie genau die geplanten Tests wählt.
        working-directory: frontend
        run: node scripts/e2e-shards.mjs plan ${{ matrix.shard }}/6 "$RUNNER_TEMP/e2e-shard.txt"
      - name: Run browser smoke tests desktop and mobile (part ${{ matrix.shard }} of 6)
        working-directory: frontend
        run: yarn test:e2e --test-list="$RUNNER_TEMP/e2e-shard.txt"
      - name: Sum up browser test timings
        # Daraus lassen sich die Dauern für die Verteilung auffrischen (docs/entwicklung/github.md).
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          if [ -f test-results/e2e-report.json ]; then
            node scripts/e2e-shards.mjs durations test-results/e2e-report.json > "$RUNNER_TEMP/e2e-durations-${{ matrix.shard }}.json"
          fi
      - name: Upload browser test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-durations-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-results-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Prüftor (#1660): Barrierefreiheit (axe, Tastatur, Namen, 200 %), Kontrast, Bundle-Budget, Ladezeit der Startseite am
  # Handy und Bewegungsregeln in einem Job - für jeden PR mit sichtbaren Änderungen (Bereich frontend) und für
  # Änderungen nur an Dateien des Tors wie PERFORMANCE_BUDGETS.md (Bereich prueftor, #2556). Rot heißt nicht
  # mergen; eine Ausnahme steht mit Begründung im PR-Text (docs/entwicklung/prueftor.md). Läuft neben „Frontend“: Der
  # Bau dauert Sekunden und ist billiger als dist als Artefakt hin- und herzuschieben; Yarn- und Browser-Cache sind
  # dieselben wie in den anderen Jobs. Dieser Job führt Code aus dem PR aus und hat deshalb nur Leserechte; den
  # Kommentar schreibt „Prüftor-Kommentar“ (ohne Checkout) aus dem Ergebnis-Artefakt.
  prueftor:
    name: Prüftor
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.prueftor == 'true'
    runs-on: ubuntu-24.04
    # Gewöhnlich gut 6 Minuten; Platz für einen wiederholten Browser-Download (bis 18 Minuten) wie in den Browser-Teilen.
    timeout-minutes: 25
    permissions:
      contents: read
      # PR-Text frisch lesen: Eine nachgetragene Ausnahme gilt nach „Re-run“, ohne neuen Push.
      pull-requests: read
      # Letztes Ergebnis von main als Artefakt laden (Vergleich im Kommentar).
      actions: read
    env:
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load the comparison data from main
        # Ausnahmelisten und Grenzen von main (wurden sie gelockert?) und das letzte Tor-Ergebnis von main. Fehlt
        # etwas, steht im Kommentar „noch kein Ergebnis von main“ - das Tor selbst hängt davon nicht ab.
        # Gleich nach dem Checkout: Der Token ist nur hier gesetzt, bevor irgendein Code aus dem PR läuft
        # (yarn install, Bau, Tests).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/prueftor"
          mkdir -p "$out/basis"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || echo "::warning::Stand von main nicht ladbar - ohne Vergleich der Listen."
            git show "$BASE_SHA:frontend/motion-rules-allowlist.json" > "$out/basis-allowlist.json" 2>/dev/null || rm -f "$out/basis-allowlist.json"
            git show "$BASE_SHA:frontend/PERFORMANCE_BUDGETS.md" > "$out/basis-budgets.md" 2>/dev/null || rm -f "$out/basis-budgets.md"
            git show "$BASE_SHA:frontend/e2e/prueftor-bekannt.json" > "$out/basis-bekannt.json" 2>/dev/null || rm -f "$out/basis-bekannt.json"
            gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""' > "$out/pr-text.md" || echo "::warning::PR-Text nicht lesbar - ohne Ausnahmen."
          fi
          # Nur ein Artefakt, das ein Lauf auf main dieses Repos erzeugt hat (nicht aus einem Fork-Zweig namens main).
          id=$(gh api "repos/$REPO/actions/artifacts?name=prueftor-main&per_page=30" --jq \
            '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].id // empty' || true)
          if [ -n "$id" ] && gh api "repos/$REPO/actions/artifacts/$id/zip" > "$out/main.zip"; then
            unzip -o -q "$out/main.zip" -d "$out/basis" || true
          fi
          ls -la "$out" "$out/basis"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Restore browser and its system packages from the cache
        # Derselbe Cache wie in den Browser-Teilen.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-debs
          key: playwright-ubuntu-24.04-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: playwright-ubuntu-24.04-
      - name: Install Playwright browser
        working-directory: frontend
        timeout-minutes: 18
        # Wie in den Browser-Teilen: kurze Zeitlimits für apt, je Versuch höchstens 5 Minuten, bis zu drei Versuche.
        # Dieselben apt-Einstellungen, damit unter dem gemeinsamen Cache-Schlüssel nie ein unvollständiger Satz liegt.
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Languages "none";\nAPT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-tls-timeouts > /dev/null
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/
          fi
          for attempt in 1 2 3; do
            if timeout --kill-after=15 300 npx playwright install --with-deps chromium; then
              # Für den Cache wie in den Browser-Teilen (gespeichert nur, wenn es den Schlüssel noch nicht gab).
              mkdir -p "$HOME/apt-debs"
              cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/" 2>/dev/null || true
              exit 0
            fi
            echo "::warning::Browser-Installation hing oder brach ab (Versuch $attempt von 3)"
            sudo pkill -9 -f '/usr/lib/apt/methods|apt-get' || true
            sleep 10
          done
          exit 1
      - name: Motion rules and palette contrast (static)
        # Das Urteil fällt in „Summarize“ - hier nur messen. Fehlt ein Bericht (Skript abgestürzt), ist die Prüfung rot.
        working-directory: frontend
        run: |
          out="$RUNNER_TEMP/prueftor"
          # Im PR: Funde auf geänderten Zeilen markieren, damit der Kommentar die neuen zuerst nennt.
          diff_base=()
          if [ -n "$BASE_SHA" ]; then diff_base=(--diff-base "$BASE_SHA"); fi
          node scripts/check-motion-rules.mjs --report "$out/bewegung.json" --base-allowlist "$out/basis-allowlist.json" "${diff_base[@]}" || true
          node scripts/check-contrast.js --report "$out/kontrast.json" > /dev/null || true
      - name: Build frontend
        id: build
        working-directory: frontend
        run: yarn build
      - name: Startup bundle budget
        if: steps.build.outcome == 'success'
        working-directory: frontend
        # Erst der Selbsttest wie in „check:bundle“ (#2556): Er prüft die Werte in PERFORMANCE_BUDGETS.md. Eine Änderung
        # nur an dieser Datei startet nur das Tor - scheitert der Selbsttest, fehlt die Messung, und das Tor ist rot.
        run: |
          if ! node --test --test-reporter=dot scripts/check-bundle-budget.test.mjs; then
            echo "::error::Selbsttest der Bundle-Grenzen rot (PERFORMANCE_BUDGETS.md) - keine Messung."
            exit 0
          fi
          node scripts/check-bundle-budget.mjs --report "$RUNNER_TEMP/prueftor/bundle.json" || true
      - name: Accessibility, contrast and motion in the browser (built dist)
        if: steps.build.outcome == 'success'
        working-directory: frontend
        run: PRUEFTOR_REPORT="$RUNNER_TEMP/prueftor/browser.json" npx playwright test -c playwright.prueftor.config.js --project=chromium || true
      - name: Load time of the home page on a phone (built dist, one worker)
        if: steps.build.outcome == 'success'
        working-directory: frontend
        run: |
          PRUEFTOR_REPORT="$RUNNER_TEMP/prueftor/ladezeit-browser.json" PRUEFTOR_LADEZEIT_OUT="$RUNNER_TEMP/prueftor/ladezeit.json" \
            npx playwright test -c playwright.prueftor.config.js --project=ladezeit --workers=1 || true
      - name: Summarize the gate
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          out="$RUNNER_TEMP/prueftor"
          set +e
          node scripts/prueftor.mjs \
            --bundle "$out/bundle.json" --kontrast "$out/kontrast.json" --bewegung "$out/bewegung.json" \
            --ladezeit "$out/ladezeit.json" --playwright "$out/browser.json" --playwright "$out/ladezeit-browser.json" \
            --pr-text "$out/pr-text.md" --basis "$out/basis/ergebnis.json" --budgets-basis "$out/basis-budgets.md" \
            --bekannt-basis "$out/basis-bekannt.json" \
            --sha "$HEAD_SHA" --lauf "$RUN_URL" --out-json "$out/ergebnis.json" --out-md "$out/kommentar.md"
          code=$?
          cat "$out/kommentar.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload the gate result for the PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: prueftor-ergebnis
          path: |
            ${{ runner.temp }}/prueftor/ergebnis.json
            ${{ runner.temp }}/prueftor/kommentar.md
          if-no-files-found: error
          retention-days: 7
      - name: Upload the gate result of main for later comparisons
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: prueftor-main
          path: ${{ runner.temp }}/prueftor/ergebnis.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prueftor-diagnose
          path: frontend/test-results/prueftor/
          if-no-files-found: ignore
          retention-days: 7

  # Der eine Kommentar des Prüftors im PR (#1660): angelegt beim ersten Lauf, danach nur aktualisiert. Kein Checkout,
  # kein Code aus dem PR - der Job liest nur das Ergebnis-Artefakt (Markdown, wird als Text gepostet). Bei PRs aus
  # Forks bekommt der Token ohnehin kein Schreibrecht; dort steht das Ergebnis nur in der Zusammenfassung des Laufs.
  prueftor-kommentar:
    name: Prüftor-Kommentar
    needs: prueftor
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' && needs.prueftor.result != 'skipped'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Kein actions: read - das Artefakt kommt aus demselben Lauf, dafür reicht der Laufzeit-Token von download-artifact.
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: prueftor-ergebnis
          path: prueftor
      - name: Create or update the gate comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test -s prueftor/kommentar.md
          head -n1 prueftor/kommentar.md | grep -qx '<!-- prueftor:1660 -->'
          id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- prueftor:1660 -->"))) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@prueftor/kommentar.md > /dev/null
            echo "Kommentar $id aktualisiert."
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@prueftor/kommentar.md > /dev/null
            echo "Kommentar angelegt."
          fi

  mobile:
    name: Mobile App
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Validate Android release Java setup without publishing
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify Java runtime
        run: java -version
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Audit mobile dependencies
        working-directory: mobile
        run: npm run audit:ci
      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Run mobile security regressions
        working-directory: mobile
        run: npm run test:security
      - name: Run mobile release tooling tests
        working-directory: mobile
        run: npm run test:release
      - name: Run mobile unit tests
        working-directory: mobile
        run: npm test
      - name: Mobile release preflight
        working-directory: mobile
        run: npm run release:preflight
      - name: Validate Expo config
        working-directory: mobile
        run: |
          npx expo install --check
          # Keep CI reproducible until the Expo SDK 57 migration in #117 is complete.
          npx --yes expo-doctor@1.20.4

  container-smoke:
    name: Production container smoke
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: production
      CORS_ORIGINS: https://example.test
      FRONTEND_URL: https://example.test
      PUBLIC_BACKEND_URL: https://example.test
      JWT_SECRET: ci-only-secret-value-with-at-least-32-characters
      SETTINGS_ENCRYPTION_KEY: NQBHeGtQg5HYMo1HzvJtSQPN7X8YpJrZDvw-XMz0Bm8=
      MONGO_USERNAME: tls_ci_admin
      MONGO_PASSWORD: tls-ci-mongo-password
      FRONTEND_BIND: 127.0.0.1
      BACKEND_BIND: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - name: Build hardened images
        run: docker compose build
      - name: Start production stack
        run: docker compose up -d
      - name: Verify liveness and readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/api/health/live >/dev/null && \
               curl --fail --silent http://127.0.0.1:8001/api/health/ready >/dev/null && \
               curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1
      - name: Verify text recognition in the backend image
        # Ergebnis-Bilder (#1756): Tesseract mit Deutsch muss im Image sein - und der zweite Leser (#2018) mit Modell.
        run: |
          docker compose exec -T backend tesseract --list-langs | grep -qx deu
          docker compose exec -T backend python -c "from services import result_image_second as s; st = s.status(); print(st); assert st['status'] == 'ok'"
      - name: Read-only host inventory smoke
        run: python3 scripts/staging-preflight.py
      - name: Verify web release and cache headers
        run: python3 scripts/check-web-update.py http://127.0.0.1:3000
      - name: Verify uploads are served by nginx
        run: python3 scripts/check-media-serving.py http://127.0.0.1:3000
      - name: Stop ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  # Ein Name für die Pflicht-Prüfung in der GitHub-Regel für main: grün, wenn keine
  # der Prüfungen oben fehlgeschlagen oder abgebrochen ist (übersprungene zählen als ok).
  # So deckt die Regel auch die Browser-Tests ab, deren Matrix-Namen bei übersprungenen
  # Läufen nicht aufgelöst werden. Ein Matrix-Job (Backend-Tests, Browser-Tests) meldet hier
  # "failure", sobald einer seiner Teile rot ist.
  ci-result:
    name: CI-Ergebnis
    # Das Prüftor (#1660) zählt mit: rot heißt nicht mergen. Der Kommentar-Job nicht - er meldet nur.
    needs: [changes, backend-checks, backend, backend-coverage, backend-mongo, frontend, frontend-unit, frontend-coverage, frontend-e2e,
      prueftor, mobile, container-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ergebnis der Prüfungen
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          BACKEND: ${{ needs.backend.result }}
          BACKEND_COVERAGE: ${{ needs.backend-coverage.result }}
          FRONTEND_UNIT: ${{ needs.frontend-unit.result }}
          FRONTEND_COVERAGE: ${{ needs.frontend-coverage.result }}
        run: |
          echo "Ergebnisse: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "Mindestens eine Prüfung ist nicht grün ($result)."; exit 1 ;;
            esac
          done
          # Liefen die Backend-Tests, muss auch die Coverage-Schwelle geprüft sein - übersprungen zählt dann nicht.
          if [ "$BACKEND" = "success" ] && [ "$BACKEND_COVERAGE" != "success" ]; then
            echo "Die Backend-Tests liefen, die Coverage-Schwelle wurde aber nicht geprüft ($BACKEND_COVERAGE)."
            exit 1
          fi
          if [ "$FRONTEND_UNIT" = "success" ] && [ "$FRONTEND_COVERAGE" != "success" ]; then
            echo "Die Frontend-Unit-Tests liefen, ihr Gesamtbericht fehlt aber ($FRONTEND_COVERAGE)."
            exit 1
          fi
